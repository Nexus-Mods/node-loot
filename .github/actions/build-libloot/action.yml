name: build libloot for Linux
description: >
  Builds the C++ wrapper of the libloot version loot_api's headers name, from its release tag, and
  writes it stripped to loot_api/<arch>/libloot.so.0 for the runner's architecture. LOOT publishes
  no Linux binary. The image the calling job runs on sets the library's glibc floor, so callers use
  the oldest one GitHub hosts.

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -nE 's/.*LIBLOOT_VERSION_(MAJOR|MINOR|PATCH) = ([0-9]+);/\2/p' loot_api/include/loot/loot_version.h | paste -sd.)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      with:
        repository: loot/libloot
        ref: ${{ steps.version.outputs.version }}
        path: libloot

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          libloot/target
        key: libloot-${{ steps.version.outputs.version }}-${{ env.ImageOS }}

    # the cmake invocation libloot's own CI uses, minus its test binary; the SONAME is libloot.so.0
    - shell: bash
      working-directory: libloot/cpp
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DLIBLOOT_BUILD_TESTS=OFF -B build
        cmake --build build --parallel
        # node's names for the architecture, which binding.gyp's target_arch uses
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64) arch=arm64 ;;
          *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        out="$GITHUB_WORKSPACE/loot_api/$arch/libloot.so.0"
        mkdir -p "$(dirname "$out")"
        cp --dereference build/libloot.so.0 "$out"
        strip --strip-unneeded "$out"
