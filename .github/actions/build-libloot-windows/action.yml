name: build libloot for Windows
description: >
  Builds the C++ wrapper of the libloot version loot_api's headers name, from its release tag, for
  the given architecture, and writes libloot.dll and libloot.lib to loot_api/<arch>.

inputs:
  arch:
    description: x64 or arm64
    required: true

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -nE 's/.*LIBLOOT_VERSION_(MAJOR|MINOR|PATCH) = ([0-9]+);/\2/p' loot_api/include/loot/loot_version.h | paste -sd.)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        case "${{ inputs.arch }}" in
          x64) echo "cmake=x64" >> "$GITHUB_OUTPUT"; echo "rust=x86_64-pc-windows-msvc" >> "$GITHUB_OUTPUT" ;;
          arm64) echo "cmake=ARM64" >> "$GITHUB_OUTPUT"; echo "rust=aarch64-pc-windows-msvc" >> "$GITHUB_OUTPUT" ;;
          *) echo "unsupported arch ${{ inputs.arch }}" >&2; exit 1 ;;
        esac

    # clean: false keeps target/ when the action runs again for the other architecture
    - uses: actions/checkout@v4
      with:
        repository: loot/libloot
        ref: ${{ steps.version.outputs.version }}
        path: libloot
        clean: false

    - shell: pwsh
      working-directory: libloot/cpp
      run: |
        $ErrorActionPreference = 'Stop'
        $rustTarget = '${{ steps.version.outputs.rust }}'
        $buildDir = 'build-${{ inputs.arch }}'
        rustup target add $rustTarget

        # libloot's CMake passes cargo a --target only when RUST_TARGET is set, and sets it itself
        # only when CMAKE_CROSSCOMPILING, which -A does not make true; unset, cargo builds for the
        # runner's architecture. The Rust standard library also needs synchronization.lib, which
        # libloot's CMake does not link.
        cmake -B $buildDir -A ${{ steps.version.outputs.cmake }} -DLIBLOOT_BUILD_TESTS=OFF `
          "-DRUST_TARGET=$rustTarget" -DCMAKE_SHARED_LINKER_FLAGS=synchronization.lib
        if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }

        # cxx-build links its generated headers into target/<rust target>/cxxbridge with relative
        # symlinks that Windows cannot resolve when cargo's OUT_DIR contains a forward slash, so
        # build the Rust layer first and replace each link with a copy of its file.
        cmake --build $buildDir --config Release --target libloot_cargo
        if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
        Get-ChildItem "../target/$rustTarget/cxxbridge" -Recurse -File -Force | Where-Object { $_.LinkType -eq 'SymbolicLink' } | ForEach-Object {
          $target = [string]$_.Target
          if (-not [IO.Path]::IsPathRooted($target)) { $target = Join-Path $_.DirectoryName ($target -replace '/', '\') }
          $target = [IO.Path]::GetFullPath($target)
          $link = $_.FullName
          Remove-Item $link -Force
          Copy-Item $target $link
        }

        cmake --build $buildDir --config Release
        if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }

        $outDir = "$env:GITHUB_WORKSPACE/loot_api/${{ inputs.arch }}"
        New-Item -ItemType Directory -Force $outDir | Out-Null
        Copy-Item "$buildDir/Release/libloot.dll", "$buildDir/Release/libloot.lib" $outDir
