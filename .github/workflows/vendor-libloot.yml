name: vendor libloot

on:
  workflow_dispatch:
    inputs:
      version:
        description: the libloot release to vendor, e.g. 0.29.6
        required: true

permissions:
  contents: write

jobs:
  # headers and the Linux library, from the release tag's sources
  vendor:
    # the oldest Linux image GitHub hosts, see .github/actions/build-libloot
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: loot/libloot
          ref: ${{ inputs.version }}
          path: libloot

      - run: |
          rm -rf loot_api/include
          cp -r libloot/cpp/include loot_api/include

      - uses: ./.github/actions/build-libloot

      - run: yarn version --patch --no-git-tag-version

      - run: |
          branch="vendor/libloot-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add loot_api package.json
          git commit -m "update to libloot ${{ inputs.version }}"
          git push --force origin "$branch"

  # the Windows libraries, built on the branch the vendor job pushed
  windows:
    needs: vendor
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor/libloot-${{ inputs.version }}

      - uses: ./.github/actions/build-libloot-windows
        with:
          arch: x64

      - uses: ./.github/actions/build-libloot-windows
        with:
          arch: arm64

      # the branch is pushed, not turned into a pull request: one the workflow token opened would
      # start no CI run, so a person opens it from the link in the run summary
      - shell: bash
        run: |
          branch="vendor/libloot-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loot_api/x64 loot_api/arm64
          git commit -m "build libloot ${{ inputs.version }} for Windows"
          git push origin "$branch"
          echo "Open the pull request: https://github.com/${{ github.repository }}/compare/$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
