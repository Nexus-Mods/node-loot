name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # the package install script prefers a published prebuild, which would leave the sources under
      # test unbuilt, so skip it and compile the addon explicitly
      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn run rebuild

      - run: yarn test
