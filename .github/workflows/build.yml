name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the oldest Linux image GitHub hosts, see .github/actions/build-libloot
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # rebuilt rather than taken from loot_api, so the sources under test always link against a
      # library of exactly the version the headers describe
      - if: runner.os == 'Linux'
        uses: ./.github/actions/build-libloot

      # the package install script prefers a published prebuild, which would leave the sources under
      # test unbuilt, so skip it and compile the addon explicitly
      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn run rebuild

      - run: yarn test
